name: APRSTX stock overlay
on:
  pull_request:
    paths:
      - 'App/apps/aprstx/**'
      - 'App/apps/app_api.h'
      - 'App/apps/pack_app.py'
      - 'tests/aprstx/**'
      - 'Dockerfile'
      - '.github/workflows/aprstx-stock.yml'
  workflow_dispatch:
jobs:
  protocol-and-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host protocol and lifecycle tests
        run: bash tests/aprstx/run.sh
      - name: Build toolchain
        run: docker build -t uvk1-uvk5v3 .
      - name: Build and bound the ARM overlay
        run: ./compile-app.sh aprstx
      - uses: actions/upload-artifact@v4
        with:
          name: APRSTX-stock
          path: |
            build/Apps/APRSTX.app
            App/apps/aprstx/aprstx.elf
            App/apps/aprstx/aprstx.map
            App/apps/aprstx/*.su
