name: Build and Release CW Firmware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Build CW firmware
      run: |
        chmod +x compile-firmware.sh
        ./compile-firmware.sh CW -DVERSION_STRING_2=${{ github.ref_name }}

    - name: Rename release artifacts
      run: |
        TAG=${{ github.ref_name }}
        cp build/CW/brass.cw.bin brass.k1-k5v3.${TAG}.bin
        cp build/CW/brass.cw.uf2 brass.k1-k5v3.${TAG}.uf2
        # Ship the CHIRP module named for this firmware release, with its
        # version string stamped to match. The module is stored generically
        # in the repo (chirp/brass.k1-k5v3.chirp.py); the version lives only in
        # the released copy so the two never drift.
        cp chirp/brass.k1-k5v3.chirp.py brass.k1-k5v3.chirp.${TAG}.py
        sed -i "s/@NR7Y_VERSION@/${TAG}/g" brass.k1-k5v3.chirp.${TAG}.py

    - name: Upload release artifacts
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        files: |
          brass.k1-k5v3.${{ github.ref_name }}.bin
          brass.k1-k5v3.${{ github.ref_name }}.uf2
          brass.k1-k5v3.chirp.${{ github.ref_name }}.py
